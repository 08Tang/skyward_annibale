name: APK

# 构建 Skyward Manager（apk-manager/）。
#
# 这个 workflow 只碰 apk-manager/：Rust 那边有自己的 build.yml 和
# preview.yml，两边互不触发。
#
# 每次构建都会把 version.properties 的补丁号加 0.0.1 再提交回去，所以同一
# 个提交只会被构建一次——否则提交版本号会再触发一轮，绕不出来。
on:
  push:
    branches: ["**"]
    # 改这个 workflow 本身也要触发一次，否则改完 CI 没法验证。
    paths: ["apk-manager/**", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 要提交版本号回去，得用能写的 token。
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip if only the version bump changed
        id: guard
        run: |
          # 上一轮构建提交的只有 version.properties，别为它再构建一次。
          # 手动 dispatch 时不跳：那是人主动要一个包，哪怕当前就在那个提交上。
          last=$(git log -1 --pretty=%s)
          changed=$(git diff-tree --no-commit-id --name-only -r HEAD || true)
          echo "last commit: $last"
          echo "changed: $changed"
          if [ "${{ github.event_name }}" = "push" ] && [ "$last" = "chore(apk): bump version" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.guard.outputs.skip != 'true'
        run: |
          # ubuntu-latest 自带 Android SDK，直接用，不装 android-actions/setup-android：
          # 那个 action 会去装一个叫 `tools` 的包，新版 SDK 仓库里已经没有它了，
          # 装不到就退出 1，把整个 job 带垮。
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        if: steps.guard.outputs.skip != 'true'
        run: |
          # compileSdk 37.0 / buildTools 37.0.0 由 build.gradle.kts 指定。SDK 37 的
          # 包名带 minor（platforms;android-37.0），不是 android-37。
          # 不装 NDK——这一版没有原生代码。
          SDKMANAGER=$(find "$ANDROID_HOME" -path '*/cmdline-tools/*/bin/sdkmanager' | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        if: steps.guard.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        if: steps.guard.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          # 证书只在 CI 里存在，仓库里不放。secret 是 base64 过的 .jks。
          #
          # 没有 secret 就不签名地构建：这样代码本身能不能编译、lint 过不过，
          # 仍然看得出来；只是产出的 APK 不能覆盖安装，所以下面会把它标成
          # 一个明确的警告，而不是让整个 job 停在第一步。
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::没有 secret APK_KEYSTORE_BASE64，本次产出未签名的 APK。"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          else
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        if: steps.guard.outputs.skip != 'true'
        working-directory: apk-manager
        run: |
          # 配置文件的字段名写错时解码不会失败，只会悄悄用默认值，所以这里
          # 必须有测试盯着；纯 JVM 测试，不需要 SDK。
          chmod +x ./gradlew || true
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        if: steps.guard.outputs.skip != 'true'
        working-directory: apk-manager
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          # gradlew 的可执行位在 git 里不一定保得住，自己补一下最稳。
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign with v1 + v2 + v3
        if: steps.guard.outputs.skip != 'true' && env.SIGNED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          # AGP 出来的包没签名（build.gradle.kts 里刻意没挂 signingConfig），
          # 因为 minSdk >= 24 时它只肯出 v2/v3，而三种都要。对着未签名的包
          # 一次签全，顺序是 zipalign 再 apksigner：反过来的话 apksigner 写
          # 进去的块会被对齐步骤打乱。
          apk=$(find apk-manager/app/build/outputs/apk/release -name '*.apk' \
            ! -name '*-aligned.apk' ! -name '*-signed.apk' | head -1)
          echo "apk: $apk"

          aligned="${apk%.apk}-aligned.apk"
          zipalign -p -f 4 "$apk" "$aligned"

          signed="${apk%.apk}-signed.apk"
          # --min-sdk-version 是关键：apksigner 按这个值判断要不要生成 v1，
          # APK 里写的是 24，它就认为 v1 多余而跳过，哪怕显式开了
          # --v1-signing-enabled。这里报低到 21，v1 才会真的写进去。
          apksigner sign \
            --min-sdk-version 21 \
            --ks "$KEYSTORE_FILE" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$signed" \
            "$aligned"

          # 用签好的包替换未签名的那个，产物目录里只留一份。
          mv -f "$signed" "$apk"
          rm -f "$aligned"

      - name: Verify signature (v1 + v2 + v3)
        if: steps.guard.outputs.skip != 'true' && env.SIGNED == 'true'
        run: |
          apk=$(find apk-manager/app/build/outputs/apk/release -name '*.apk' \
            ! -name '*-aligned.apk' ! -name '*-signed.apk' | head -1)
          out=$(apksigner verify --min-sdk-version 21 --verbose --print-certs "$apk")
          echo "$out"
          # 三种签名缺一个就失败：只签 v2/v3 的话老系统装不上，而这件事
          # 在真机上才会发现，不能在 CI 里放过。
          for scheme in v1 v2 v3; do
            echo "$out" | grep -q "Verified using $scheme scheme.*: true" \
              || { echo "::error::缺少 $scheme 签名"; exit 1; }
          done

      - name: Upload APK
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skyward-manager
          path: apk-manager/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Bump version and commit back
        if: steps.guard.outputs.skip != 'true'
        working-directory: apk-manager
        run: |
          # 每次构建把补丁号加 0.0.1，并提交回去，让下一个构建拿到新号。
          cur=$(sed -n 's/^versionName=//p' version.properties)
          major=$(echo "$cur" | cut -d. -f1)
          minor=$(echo "$cur" | cut -d. -f2)
          patch=$(echo "$cur" | cut -d. -f3)
          next="$major.$minor.$((patch + 1))"
          printf 'versionName=%s\n' "$next" > version.properties
          echo "bumped $cur -> $next"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(apk): bump version" || echo "版本号没变，跳过提交"
          git push
